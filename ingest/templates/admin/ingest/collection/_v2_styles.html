<style>
  /* ── Shared V2 workflow styles ── */
  .v2-header { display:flex; align-items:baseline; gap:.75em; margin:0 0 1em; flex-wrap:wrap; }
  .v2-header h1 { margin:0; font-size:1.15em; }
  .v2-header .sub { font-size:.9em; opacity:.7; }

  .v2-meta { display:flex; gap:1.5em; margin:.25em 0 1.25em; font-size:.88em; opacity:.85; }
  .v2-meta strong { font-weight:700; }

  /* Alert banners */
  .v2-alert { border-radius:6px; padding:.85em 1em; margin:0 0 1em; line-height:1.5; }
  .v2-alert.error   { background:#fdecea; border:1px solid #f5c6cb; color:#721c24; }
  .v2-alert.warning { background:#fff8e1; border:1px solid #ffe082; color:#5d4037; }
  .v2-alert.success { background:#e8f5e9; border:1px solid #a5d6a7; color:#1b5e20; }
  .v2-alert ul { margin:.5em 0 0 1.2em; padding:0; }
  .v2-alert li { margin:.2em 0; }

  /* Panels (bordered cards) */
  .v2-panel {
    background:#fff; border:1px solid #d0d0d0; border-radius:6px;
    box-shadow:0 1px 2px rgba(0,0,0,.04); margin:0 0 1em; overflow:hidden;
  }
  .v2-panel > header {
    padding:.7em 1em; background:#f5f5f5; border-bottom:1px solid #e0e0e0;
    font-size:.82em; text-transform:uppercase; letter-spacing:.05em;
    color:#555; font-weight:600;
  }
  .v2-panel > .body { padding:.9em 1em; color:#222; }
  .v2-panel > .body code { color:#111; }

  /* Choice lists (radios) */
  .v2-choice-list { display:flex; flex-direction:column; gap:.35em; margin:0; padding:0; list-style:none; }
  .v2-choice {
    display:flex; align-items:center; gap:.6em; padding:.55em .75em;
    border:1px solid #ddd; border-radius:4px; background:#fafafa;
    cursor:pointer; transition:background .12s, border-color .12s;
  }
  .v2-choice:hover  { background:#f0f7ff; border-color:#a3caff; }
  .v2-choice input[type=radio] { accent-color:#1a73e8; width:1.05em; height:1.05em; margin:0; flex-shrink:0; }
  .v2-choice input[type=radio]:checked + .v2-choice-label { color:#1a73e8; font-weight:600; }
  .v2-choice-label { font-size:.9em; line-height:1.4; }
  .v2-choice .mono { font-family:monospace; font-size:.85em; }

  /* Buttons */
  .v2-btn {
    display:inline-flex; align-items:center; justify-content:center;
    padding:.55em 1em; border-radius:4px; font-size:.9em; font-weight:600;
    cursor:pointer; text-decoration:none; border:1px solid transparent;
    transition:filter .12s, box-shadow .12s;
  }
  .v2-btn:hover  { filter:brightness(1.05); box-shadow:0 1px 3px rgba(0,0,0,.12); }
  .v2-btn:active { filter:brightness(.95); }
  .v2-btn.primary   { background:#1a73e8; color:#fff; border-color:#1a73e8; }
  .v2-btn.secondary { background:#fff; color:#333; border-color:#ccc; }
  .v2-btn.danger    { background:#fff; color:#c62828; border-color:#c62828; }

  .v2-actions { display:flex; gap:.6em; align-items:center; margin-top:1em; flex-wrap:wrap; }

  /* Result tables */
  .v2-table { width:100%; border-collapse:collapse; font-size:.9em; }
  .v2-table th {
    padding:.55em .85em; text-align:left; background:#f5f5f5;
    border-bottom:2px solid #ddd; font-size:.8em;
    text-transform:uppercase; letter-spacing:.04em; color:#555;
  }
  .v2-table td { padding:.6em .85em; border-bottom:1px solid #eee; color:#222; }
  .v2-table td code { color:#111; background:#f5f5f5; padding:.1em .35em; border-radius:3px; }
  .v2-table tr:hover td { background:#fafafa; }
  .v2-status-match   { color:#2e7d32; font-weight:700; }
  .v2-status-nomatch { color:#c62828; font-weight:700; }

  /* Inline unlock */
  .v2-locked-inline { display:inline-flex; align-items:center; gap:.5em; margin-top:.5em; }
</style>
